<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CJDF</title>

    <link rel="stylesheet" href="cjdf.css">
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <!-- LOGO -->
        <img
            class="logo"
            src="img/WhatsApp Image 2026-09-02 at 23.10.06.jpeg"
            alt="Logo CJDF"
        >

        <!-- MENU -->
        <nav>
            <ul>
                <li>
                    <a href="#imagens">IMAGENS</a>
                </li>

                <li>
                    <a href="#projetos">PROJETOS</a>
                </li>

                <li>
                    <a href="#atividades">ATIVIDADES</a>
                </li>
            </ul>
        </nav>

    </header>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main>

        <!-- =========================
             SEÇÃO DE IMAGENS
        ========================== -->

        <section class="section1" id="imagens">

            <div class="slideshow">

                <!-- IMAGEM 1 -->
                <div class="slide ativa">
                    <img
                        src="img/0a7b19d3-ec10-484b-85a6-4a1b922158ab.jpg"
                        alt="Primeira imagem"
                    >
                </div>

                <!-- IMAGEM 2 -->
                <div class="slide">
                    <img
                        src="img/15c4b646-8f5b-4158-bf5d-9aedb25895c8.jpg"
                        alt="Segunda imagem"
                    >
                </div>

                <!-- IMAGEM 3 -->
                <div class="slide">
                    <img
                        src="img/9b0ac6e3-cd4f-4494-83a0-9d6dab5df16a.jpg"
                        alt="Terceira imagem"
                    </div>

            </div>

        </section>


        <!-- =========================
             SEÇÃO DE PROJETOS
        ========================== -->

        <section id="projetos">

            <h2>PROJETOS</h2>

        </section>


        <!-- =========================
             SEÇÃO DE ATIVIDADES
        ========================== -->

        <section id="atividades">

            <h2>ATIVIDADES</h2>

        </section>


    </main>


    <!-- JAVASCRIPT -->
    <script src="CJDF.js"></script>

</body>

</html>
